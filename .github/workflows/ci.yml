name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 취약점은 코드를 안 건드려도 새로 생기므로 주기적으로도 돌립니다.
  schedule:
    - cron: '0 0 * * 1'

# 같은 브랜치에 연달아 푸시하면 이전 실행은 취소합니다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 검증 단계는 DB 에 붙지 않습니다(단위 테스트뿐). 다만 Prisma 클라이언트 생성과
  # 환경 변수 스키마가 형식을 검사하므로, 형태만 맞는 값을 넣어 둡니다.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public

jobs:
  verify:
    name: 검증 (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json 의 engines 는 >=20.11 입니다. LTS 두 개와 현재 버전을 봅니다.
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      # packageManager 필드에 적힌 버전을 그대로 씁니다.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      # 리포지토리 계층이 Prisma 가 만들어내는 타입을 참조합니다.
      # 생성하지 않으면 타입 검사부터 실패합니다.
      - name: Prisma 클라이언트 생성
        run: pnpm run db:generate

      - name: 타입 검사 (전체 워크스페이스)
        run: pnpm run typecheck

      - name: 린트
        run: pnpm run lint

      - name: 포맷 확인
        run: pnpm run format:check

      - name: 테스트
        run: pnpm run test:coverage

      - name: 빌드 (앱 4개 + 패키지)
        run: pnpm run build

      # 커버리지 리포트는 최신 Node 실행분 하나만 남깁니다.
      - name: 커버리지 업로드
        if: matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  migrations:
    name: 마이그레이션 검증
    runs-on: ubuntu-latest

    # 스키마와 마이그레이션이 어긋난 채 배포되면 운영에서 처음 발견됩니다.
    # 빈 DB 에 실제로 적용해 보는 것이 유일하게 확실한 검사입니다.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 마이그레이션 적용
        run: pnpm run db:deploy

      # 마이그레이션을 적용한 결과가 schema.prisma 와 같은지 확인합니다.
      # 스키마만 고치고 마이그레이션을 안 만든 PR 이 여기서 걸립니다.
      - name: 스키마 표류 확인
        run: pnpm --filter @chzzk-bot/database exec prisma migrate diff
          --from-schema-datasource prisma/schema.prisma
          --to-schema-datamodel prisma/schema.prisma
          --exit-code

      - name: 시드 실행
        run: pnpm run db:seed

  audit:
    name: 취약점 점검
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # high 이상에서만 실패시킵니다.
      #
      # moderate 하나가 남아 있는데 고칠 수 없습니다: socket.io-client 2.5.0 이
      # 끌고 오는 parseuri 의 ReDoS 입니다. 치지직 세션 API 는 socket.io 프로토콜을
      # 2.0.3 까지만 지원해서 상위 버전으로 올리면 연결 자체가 안 됩니다.
      # 파싱 대상은 치지직이 발급한 세션 URL 이라 외부 입력이 아닙니다.
      - name: pnpm audit
        run: pnpm audit --audit-level high
